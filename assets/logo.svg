<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="500" height="120" role="img" aria-labelledby="logo-title logo-desc">
  <title id="logo-title">SourceDesk AI Logo</title>
  <desc id="logo-desc">SourceDesk AI logo featuring geometric open reference pages with a teal connected search lens and warm amber citation node on the left, paired with the SourceDesk AI wordmark on the right.</desc>

  <!-- Symbol -->
  <g id="symbol" transform="translate(8, 6) scale(0.9)">
    <!-- Open reference pages -->
    <g id="pages">
      <!-- Subtle lower page stack edge -->
      <path d="M 18 95 L 56 101 L 60 99 L 64 101 L 102 95" fill="none" stroke="#0D9488" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.7" />

      <!-- Left page (deep navy) -->
      <path d="M 20 24 L 54 29 Q 57 29.5 57 33 L 57 94 Q 57 97 54 96.5 L 20 91 Q 14 90 14 84 L 14 30 Q 14 24 20 24 Z" fill="#0F2942" />

      <!-- Right page (slate navy) -->
      <path d="M 100 24 L 66 29 Q 63 29.5 63 33 L 63 94 Q 63 97 66 96.5 L 100 91 Q 106 90 106 84 L 106 30 Q 106 24 100 24 Z" fill="#173A5E" />

      <!-- Subtle reference text lines on left page -->
      <line x1="23" y1="42" x2="47" y2="45.5" stroke="#5EEAD4" stroke-width="3" stroke-linecap="round" opacity="0.45" />
      <line x1="23" y1="74" x2="45" y2="77" stroke="#5EEAD4" stroke-width="3" stroke-linecap="round" opacity="0.45" />
    </g>

    <!-- Connected knowledge & search motif -->
    <g id="knowledge-search">
      <!-- Connection bridge from cited passage to search lens -->
      <line x1="35" y1="58" x2="78" y2="54" stroke="#2DD4BF" stroke-width="3.5" stroke-linecap="round" />

      <!-- Source citation node on left page -->
      <circle cx="35" cy="58" r="5" fill="#14B8A6" />

      <!-- Search lens handle -->
      <line x1="89" y1="65" x2="100" y2="76" stroke="#14B8A6" stroke-width="5.5" stroke-linecap="round" />

      <!-- Search lens ring -->
      <circle cx="78" cy="54" r="15" fill="#0F2942" stroke="#14B8A6" stroke-width="5" />

      <!-- Warm accent focal node (cited AI answer) -->
      <circle cx="78" cy="54" r="5" fill="#F59E0B" />
    </g>
  </g>

  <!-- Wordmark -->
  <g id="wordmark">
    <text x="134" y="75" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="700" letter-spacing="-0.8">
      <tspan fill="#0F2942">SourceDesk</tspan><tspan fill="#0D9488"> AI</tspan>
    </text>
  </g>
</svg>
